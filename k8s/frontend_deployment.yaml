apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: employee-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend-deployment

  template:
    metadata:
      labels:
        app: frontend-deployment
    spec:    
      containers:
      - name: frontend

        image: new-frontend:1.0 
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 80
      
        envFrom:
        - configMapRef:
            name: frontend-configmaps

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi    
