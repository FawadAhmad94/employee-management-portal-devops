apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: employee-app

spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: backend-deployment
  
  template:
    metadata:
      labels:
        app: backend-deployment
    
    spec:
      containers:
      - name: backend
        
        image: fawadahmad94/employee-backend:1.0 
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5000
       
        envFrom:
        - configMapRef:
            name: backend-configmaps        
        - secretRef:
            name: backend-secrets
        
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi  
