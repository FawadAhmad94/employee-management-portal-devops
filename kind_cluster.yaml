kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4 
name: devops-cluster
nodes:
  - role: control-plane

  - role: worker
    extraPortMappings:
      - containerPort: 30500
        hostPort: 5000
      - containerPort: 30080
        hostPort: 80  
      - containerPort: 30090
        hostPort: 30090  
